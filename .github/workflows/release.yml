name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  linux:
    needs: version
    name: Linux ${{ matrix.machine }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: x86_64
            runner: ubuntu-22.04
            appimagetool: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - machine: aarch64
            runner: ubuntu-22.04-arm
            appimagetool: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev \
            libvulkan1 mesa-vulkan-drivers xvfb
      - run: rustup update stable && rustup default stable
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Install appimagetool
        env:
          MACHINE: ${{ matrix.machine }}
          CHECKSUM: ${{ matrix.appimagetool }}
        run: |
          curl -fsSLo appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$MACHINE.AppImage"
          echo "$CHECKSUM  appimagetool" | sha256sum --check
          sudo install -m755 appimagetool /usr/local/bin/appimagetool
      - run: cargo build --release --locked -p flexolotl --features x11
      - run: packaging/linux/bundle.sh "$VERSION" target/release/flexolotl dist
      - name: Start it once
        run: |
          chmod +x dist/*.AppImage
          xvfb-run -a -s "-screen 0 1000x920x24" bash -c '
            env -u WAYLAND_DISPLAY APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage &
            sleep 12
            kill -0 $!
            kill $!'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-${{ matrix.machine }}
          path: dist
          if-no-files-found: error

  macos:
    needs: version
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: arm64, runner: macos-15 }
          - { label: x64, runner: macos-15-intel }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --locked -p flexolotl
      - run: packaging/macos/bundle.sh "$VERSION" target/release/flexolotl "${{ matrix.label }}" dist
      - name: Start it once
        run: |
          mkdir -p screen app
          ditto -x -k dist/*.zip app
          app/Flexolotl.app/Contents/MacOS/flexolotl &
          sleep 12
          kill -0 $!
          screencapture -x screen/macos.png || true
          kill $!
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-macos-${{ matrix.label }}
          path: screen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-macos-${{ matrix.label }}
          path: dist
          if-no-files-found: error

  windows:
    needs: version
    name: Windows ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: x64, runner: windows-2022, architecture: x64compatible }
          - { label: arm64, runner: windows-11-arm, architecture: arm64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LABEL: ${{ matrix.label }}
      ARCHITECTURE: ${{ matrix.architecture }}
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup update stable
          rustup default stable
      - run: cargo build --release --locked -p flexolotl
      - name: Package
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force dist, portable | Out-Null
          $out = (Resolve-Path dist).Path
          $program = (Resolve-Path target\release\flexolotl.exe).Path
          & $compiler "/DVersion=$env:VERSION" "/DArchitecture=$env:ARCHITECTURE" "/DLabel=$env:LABEL" "/DProgram=$program" "/DOutput=$out" packaging\windows\flexolotl.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item $program, LICENSE portable
          Compress-Archive portable\* "dist\Flexolotl-$env:VERSION-win-$env:LABEL.zip"
      - name: Start it once
        run: |
          New-Item -ItemType Directory -Force screen | Out-Null
          $app = Start-Process target\release\flexolotl.exe -PassThru
          Start-Sleep 12
          if ($app.HasExited) { throw "flexolotl exited with $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $area = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = New-Object System.Drawing.Bitmap $area.Width, $area.Height
          [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($area.Location, [System.Drawing.Point]::Empty, $area.Size)
          $image.Save("$PWD\screen\windows.png")
          Stop-Process $app
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-windows-${{ matrix.label }}
          path: screen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows-${{ matrix.label }}
          path: dist
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - run: |
          awk -v version="$VERSION" '$1 == "##" && $2 == version { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md >notes.md
          test -s notes.md
          cd dist && sha256sum -- * >SHA256SUMS
      - name: Sign the checksums
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          printf "%s\n" "$SIGNING_KEY" >"$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm "$RUNNER_TEMP/key.pem"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "Flexolotl $VERSION" --notes-file notes.md --verify-tag
